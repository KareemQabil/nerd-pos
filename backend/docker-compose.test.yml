version: "3.9"

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: nerdpos_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nerdpos_test
    ports:
      - "5433:5432"
    volumes:
      - nerdpos_test_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nerdpos_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nerdpos_test_db:
